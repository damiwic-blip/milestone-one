<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Data Net | Enterprise Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- 🌐 MAIN ENTERPRISE INTERFACE CONTAINER -->
    <div class="dashboard-container">
        
        <!-- 🧭 NAVIGATION SIDEBAR CONTAINER -->
        <aside class="sidebar">
            <div class="brand-logo">
                <h2>CORE DATA NET</h2>
                <span class="status-badge">● LIVE 24/7</span>
            </div>
            <nav class="nav-links">
                <button class="nav-btn active" id="btn-dashboard">🖥️ Dashboard</button>
                <button class="nav-btn" id="btn-data">📥 Data Entry</button>
                <button class="nav-btn" id="btn-logs">⚙️ System Logs</button>
            </nav>
            <div class="sidebar-footer">
                <span>v1.0.0 Stable</span>
            </div>
        </aside>

        <!-- 📊 MAIN DATA DISPLAY DECK -->
        <main class="main-content">
            
            <!-- TOP CARD MATRIX -->
            <header class="dashboard-header">
                <div class="metric-card revenue-card">
                    <h3>🟢 REVENUE PROTECTED</h3>
                    <p class="metric-value" id="protected-display">$0.00</p>
                </div>
                <div class="metric-card leak-card">
                    <h3>⚠️ IDENTIFIED LEAKS</h3>
                    <p class="metric-value" id="leak-display">$0.00</p>
                </div>
            </header>

            <!-- 📥 CLIENT DATA SUBMISSION GATEWAY -->
            <section class="workspace-card" id="form-section">
                <div class="card-header">
                    <h2>AUTOMATED CLIENT SUBMISSION GATEWAY</h2>
                    <p>Input active logistics parameters to trigger the real-time calculation pipeline.</p>
                </div>
                
                <form id="logistics-form" class="grid-form">
                    <div class="input-group">
                        <label for="fleet-size">Fleet Size (Total Vehicles)</label>
                        <input type="number" id="fleet-size" placeholder="e.g. 150" required>
                    </div>
                    <div class="input-group">
                        <label for="shipping-vol">Monthly Shipping Volume</label>
                        <input type="number" id="shipping-vol" placeholder="e.g. 50000" required>
                    </div>
                    <div class="input-group">
                        <label for="target-margin">Target Margin Efficiency (%)</label>
                        <input type="number" step="0.1" id="target-margin" placeholder="e.g. 85.5" required>
                    </div>
                    <div class="input-group">
                        <label for="operational-overhead">Operational Overhead (\$)</label>
                        <input type="number" id="operational-overhead" placeholder="e.g. 120000" required>
                    </div>
                    
                    <button type="submit" class="submit-btn" id="run-pipeline-btn">
                        ⚡ RUN REAL-TIME CALCULATION PIPELINE
                    </button>
                </form>
            </section>

        </main>
    </div>

    <!-- 🎛️ DATA PIPELINE EVENT SCRIPT -->
    <script>
        document.getElementById('logistics-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                fleetSize: Number(document.getElementById('fleet-size').value),
                shippingVolume: Number(document.getElementById('shipping-vol').value),
                targetMargin: Number(document.getElementById('target-margin').value),
                operationalOverhead: Number(document.getElementById('operational-overhead').value)
            };

            try {
                const response = await fetch('/api/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                document.getElementById('protected-display').innerText = `$${data.revenueProtected.toLocaleString()}`;
                document.getElementById('leak-display').innerText = `$${data.identifiedLeaks.toLocaleString()}`;
                
                console.log("Pipeline run complete. Metrics successfully updated.");
            } catch (error) {
                console.error("Error executing live data calculations:", error);
            }
        });
    </script>
</body>
</html>
